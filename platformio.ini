; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; lines starting with ";" are comments. Each [section] is a group of settings.

; project-wide settings
[platformio]
; the environment used when you click Build/Upload without choosing one (the main mic app)
default_envs = esp32-s3-devkitc-1

; settings shared by every environment below ([env:...] sections inherit everything here)
[env]
; Espressif's ESP32 toolchain and SDK
platform = espressif32
; the exact board: ESP32-S3 DevKitC-1 (sets the chip, pins, flash layout, etc.)
board = esp32-s3-devkitc-1
; write the code with the Arduino framework (setup()/loop(), Serial, Wire, etc.)
framework = arduino
; this board's flash is quad-SPI ("qio") and its PSRAM (extra RAM) is octal-SPI ("opi")
board_build.arduino.memory_type = qio_opi
; the board has 16 MB of flash memory for the program
board_upload.flash_size = 16MB
; extra settings passed to the compiler
build_flags =
    ; tell the Arduino core the board has PSRAM, so it turns it on
    -DBOARD_HAS_PSRAM
    ; send Serial over the chip's built-in USB port, so the serial monitor works on that port
    -DARDUINO_USB_CDC_ON_BOOT=1
; serial monitor speed in bits per second; must match Serial.begin() in the code
monitor_speed = 115200
; libraries PlatformIO downloads automatically ("^" = this version or any newer compatible one)
lib_deps =
    ; driver for the SSD1306 OLED chip
    adafruit/Adafruit SSD1306@^2.5.13
    ; drawing functions (text, lines, shapes) used by the SSD1306 driver
    adafruit/Adafruit GFX Library@^1.11.11

; main app (phase 3: stream INMP441 audio clips over serial to record_clip.py)
[env:esp32-s3-devkitc-1]
; which files in src/ to compile: + adds, - removes. Everything, except the oled_test/ and archive/ folders
build_src_filter = +<*> -<oled_test/> -<archive/>

; standalone SSD1306 OLED test
[env:oled_test]
; nothing in src/ except the oled_test/ folder
build_src_filter = -<*> +<oled_test/>

; archived phase 2 app (INMP441 mic + OLED level meter), saved 2026-10-05
[env:phase2_level_meter]
; nothing in src/ except the archived phase 2 folder
build_src_filter = -<*> +<archive/2026-10-05_phase2_level_meter/>
